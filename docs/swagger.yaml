          description: Bad Request
          schema:
            $ref: '#/definitions/schema.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/schema.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category for the authenticated user
      parameters:
      - description: Category details
        in: body
